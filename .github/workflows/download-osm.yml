# گام ۴: اجرای اسکریپت پایتون توکار
- name: Download OSM data
  run: |
    python -c "
import argparse
import sys
import os
import requests

DEFAULT_USER_AGENT = 'GitHubAction-OSMDownloader/1.0'

def build_overpass_query(min_lon, min_lat, max_lon, max_lat):
    bbox = f'({min_lat},{min_lon},{max_lat},{max_lon})'
    query = f'''
    [out:xml][timeout:300];
    (
      node{bbox};
      way{bbox};
      relation{bbox};
    );
    out body;
    '''
    return query

def download_osm_file(min_lon, min_lat, max_lon, max_lat, output_file):
    query = build_overpass_query(min_lon, min_lat, max_lon, max_lat)
    user_agent = os.environ.get('OVERPASS_USER_AGENT', DEFAULT_USER_AGENT)
    headers = {'User-Agent': user_agent}
    print(f'[INFO] Sending request to Overpass API for bounding box: {min_lon}, {min_lat}, {max_lon}, {max_lat}')
    resp = requests.post('https://overpass-api.de/api/interpreter', data={'data': query}, headers=headers, timeout=300)
    resp.raise_for_status()
    with open(output_file, 'w', encoding='utf-8') as f:
        f.write(resp.text)
    print(f'[SUCCESS] OSM data saved to {output_file}')
    return True

def main():
    # خواندن ورودی از متغیرهای محیطی به جای argparse (برای سادگی در این روش)
    min_lon = float(os.environ['MIN_LON'])
    min_lat = float(os.environ['MIN_LAT'])
    max_lon = float(os.environ['MAX_LON'])
    max_lat = float(os.environ['MAX_LAT'])
    output_file = 'downloaded_data.osm'
    if download_osm_file(min_lon, min_lat, max_lon, max_lat, output_file):
        print('[INFO] Success')
    else:
        sys.exit(1)

if __name__ == '__main__':
    main()
"
  env:
    OVERPASS_USER_AGENT: "GitHubAction-OSMDownloader/1.0"
    MIN_LON: ${{ github.event.inputs.min_lon }}
    MIN_LAT: ${{ github.event.inputs.min_lat }}
    MAX_LON: ${{ github.event.inputs.max_lon }}
    MAX_LAT: ${{ github.event.inputs.max_lat }}
