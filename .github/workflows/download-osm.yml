name: Download OSM Data by Bounding Box

on:
  workflow_dispatch:
    inputs:
      min_lon:
        description: 'حداقل طول جغرافیایی (Longitude) - غربی ترین نقطه'
        required: true
        default: '51.338'
      min_lat:
        description: 'حداقل عرض جغرافیایی (Latitude) - جنوبی ترین نقطه'
        required: true
        default: '35.699'
      max_lon:
        description: 'حداکثر طول جغرافیایی (Longitude) - شرقی ترین نقطه'
        required: true
        default: '51.345'
      max_lat:
        description: 'حداکثر عرض جغرافیایی (Latitude) - شمالی ترین نقطه'
        required: true
        default: '35.703'

jobs:
  download_osm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download OSM data using embedded Python script
        env:
          MIN_LON: ${{ github.event.inputs.min_lon }}
          MIN_LAT: ${{ github.event.inputs.min_lat }}
          MAX_LON: ${{ github.event.inputs.max_lon }}
          MAX_LAT: ${{ github.event.inputs.max_lat }}
          OVERPASS_USER_AGENT: "GitHubAction-OSMDownloader/1.0 (https://github.com/YOUR_USERNAME/osm-downloader)"
        run: |
          python -c "
import os
import sys
import requests

def build_query(min_lon, min_lat, max_lon, max_lat):
    bbox = f'({min_lat},{min_lon},{max_lat},{max_lon})'
    return f'''[out:xml][timeout:300];
(
  node{bbox};
  way{bbox};
  relation{bbox};
);
out body;'''

def download_osm():
    min_lon = float(os.environ['MIN_LON'])
    min_lat = float(os.environ['MIN_LAT'])
    max_lon = float(os.environ['MAX_LON'])
    max_lat = float(os.environ['MAX_LAT'])
    
    # Validation
    if not (-180 <= min_lon <= 180) or not (-180 <= max_lon <= 180):
        print('ERROR: Longitude out of range (-180 to 180)')
        sys.exit(1)
    if not (-90 <= min_lat <= 90) or not (-90 <= max_lat <= 90):
        print('ERROR: Latitude out of range (-90 to 90)')
        sys.exit(1)
    if min_lat >= max_lat or min_lon >= max_lon:
        print('ERROR: Invalid bounding box (min > max)')
        sys.exit(1)
    
    query = build_query(min_lon, min_lat, max_lon, max_lat)
    headers = {'User-Agent': os.environ.get('OVERPASS_USER_AGENT', 'OSM-Downloader')}
    
    print(f'Downloading OSM data for bbox: {min_lon},{min_lat} to {max_lon},{max_lat}')
    try:
        r = requests.post('https://overpass-api.de/api/interpreter', data={'data': query}, headers=headers, timeout=300)
        r.raise_for_status()
        with open('downloaded_data.osm', 'w', encoding='utf-8') as f:
            f.write(r.text)
        print('Success: downloaded_data.osm saved')
    except Exception as e:
        print(f'ERROR: {e}')
        sys.exit(1)

if __name__ == '__main__':
    download_osm()
"

      - name: Upload OSM file
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-osm-data
          path: downloaded_data.osm
          retention-days: 90
